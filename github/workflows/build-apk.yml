name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip
        run: unzip -q aplikasi-stok.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependency
        working-directory: aplikasi-stok
        run: npm install --no-audit --no-fund
      - name: Buat proyek Android
        working-directory: aplikasi-stok
        run: npx cap add android
      - name: Pasang izin kamera dan ikon
        working-directory: aplikasi-stok
        run: python3 tools/patch_android.py
      - name: Sinkron file web
        working-directory: aplikasi-stok
        run: npx cap sync android
      - name: Build APK
        working-directory: aplikasi-stok/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aplikasi-stok-apk
          path: aplikasi-stok/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
